name: Deploy to Deno Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Deno Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for Deno Deploy authentication
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint code
        run: deno lint

      - name: Run tests
        run: deno task test
        continue-on-error: true

      # Deno Deploy automatically deploys when you push to main
      # This workflow just runs quality checks
      # To deploy manually via GitHub Actions instead, uncomment below:

      # - name: Deploy to Deno Deploy
      #   uses: denoland/deployctl@v1
      #   with:
      #     project: qr-attends # Change to your project name
      #     entrypoint: main.ts
      #     root: .
