# Offline Mode Flow Test
# Tests offline queue and sync functionality

appId: com.leodyversemilla07.qrattends
---

# Assumes user is logged in
- launchApp

# Wait for home
- waitForAnimationToEnd
- assertVisible: "Dashboard"

# Go to an event
- tapOn:
    text: ".*"
    index: 0

- waitForAnimationToEnd
- assertVisible: "Event Details"

# Simulate offline mode (platform specific)
# On iOS simulator: Device > Network Link Conditioner
# On Android emulator: Extended Controls > Cellular
# For Maestro, we can't directly control network, so we'll test the UI

# Verify online indicator
- assertVisible: "Online"

# Test manual check-in (works offline too)
- tapOn: "Manual Check-in"

- waitForAnimationToEnd

- tapOn:
    id: "card-input"
- inputText: "OFFLINE-TEST-001"

- tapOn: "Check In"

- waitForAnimationToEnd

# Check for offline indicator if network was disabled
- runFlow:
    when:
      visible: "Offline Mode"
    commands:
      - assertVisible: ".*offline.*"

# Take screenshot
- takeScreenshot: offline-test
