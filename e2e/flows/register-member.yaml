# Member Registration Flow Test
# Tests registering a new member

appId: com.leodyversemilla07.qrattends
---

# Assumes user is logged in
- launchApp

# Wait for home
- waitForAnimationToEnd
- assertVisible: "Dashboard"

# Navigate to Members tab
- tapOn: "Members"

# Wait for members screen
- waitForAnimationToEnd
- assertVisible: "Members"

# Tap Add Member
- tapOn: "Add Member"

# Wait for modal
- waitForAnimationToEnd
- assertVisible: "Register Member"

# Fill in member details
- tapOn:
    id: "first-name-input"
- inputText: "John"

- tapOn:
    id: "last-name-input"
- inputText: "Doe"

- tapOn:
    id: "middle-initial-input"
- inputText: "A"

- tapOn:
    id: "student-id-input"
- inputText: "2024001"

- tapOn:
    id: "year-section-input"
- inputText: "BSIT-4A"

- tapOn:
    id: "card-number-input"
- inputText: "MAESTRO-TEST-001"

- tapOn:
    id: "email-input"
- inputText: "john.doe@example.com"

# Submit form
- tapOn: "Register Member"

# Wait for registration
- waitForAnimationToEnd

# Verify success
- assertVisible: "John Doe"

# Take screenshot
- takeScreenshot: member-registered
