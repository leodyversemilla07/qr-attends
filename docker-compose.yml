# Docker Compose configuration for QR Attendance System
services:
  qr-attends:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr-attends-app
    expose:
      - "5173"
    volumes:
      # Persist Deno KV database
      - kv-data:/data
      # Mount source code for development (comment out for production)
      - .:/app
      - /app/node_modules
    environment:
      # Override with your own JWT secret in production
      - JWT_SECRET=${JWT_SECRET:-supersecret-change-in-production}
      - DENO_KV_PATH=/data/kv.db
      - DENO_ENV=${DENO_ENV:-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - qr-attends-network

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: qr-attends-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # For SSL certificates (create these directories)
      - ./ssl:/etc/nginx/ssl:ro
      # For Let's Encrypt ACME challenge
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - qr-attends
    restart: unless-stopped
    networks:
      - qr-attends-network

  # Optional: Certbot for Let's Encrypt SSL (uncomment for auto-SSL)
  # certbot:
  #   image: certbot/certbot
  #   container_name: qr-attends-certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  kv-data:
    driver: local

networks:
  qr-attends-network:
    driver: bridge
