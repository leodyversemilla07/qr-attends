<!-- Simple SVG icon placeholder for PWA -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="192"
  height="192"
  viewBox="0 0 192 192"
>
  <rect width="192" height="192" fill="#667eea" />
  <g transform="translate(48, 48)">
    <!-- QR Code Icon -->
    <rect x="0" y="0" width="40" height="40" fill="white" rx="4" />
    <rect x="8" y="8" width="24" height="24" fill="#667eea" rx="2" />
    <rect x="12" y="12" width="16" height="16" fill="white" />

    <rect x="56" y="0" width="40" height="40" fill="white" rx="4" />
    <rect x="64" y="8" width="24" height="24" fill="#667eea" rx="2" />
    <rect x="68" y="12" width="16" height="16" fill="white" />

    <rect x="0" y="56" width="40" height="40" fill="white" rx="4" />
    <rect x="8" y="64" width="24" height="24" fill="#667eea" rx="2" />
    <rect x="12" y="68" width="16" height="16" fill="white" />

    <!-- Scan pattern -->
    <rect x="56" y="56" width="16" height="16" fill="white" rx="2" />
    <rect x="80" y="56" width="16" height="16" fill="white" rx="2" />
    <rect x="56" y="80" width="16" height="16" fill="white" rx="2" />
    <rect x="80" y="80" width="16" height="16" fill="white" rx="2" />
  </g>
</svg>
